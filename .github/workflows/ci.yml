name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read   # releases are windows.yml's job

# As in windows.yml: a tag's run cancels the branch run for the same commit and is never cancelled itself, and a
# newer push to a pull request cancels the check of the push it replaces. cancel-in-progress belongs to the arriving
# run (see windows.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # The NuGet cache, keyed as in windows.yml.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet test tests/ToneSnip.Core.Tests -c Release
      # assets/ is generated from the SVGs in assets/; --check fails if anything committed is stale. It runs on
      # Linux because cairosvg needs a native cairo library that windows-latest does not ship.
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      # Pinned: --check compares bytes, so a Pillow or cairosvg release that changes PNG output would fail it.
      - run: python -m pip install "pillow==12.3.*" "cairosvg==2.9.*"
      - run: python tools/gen-assets.py --check
      # The WinUI app itself needs the Windows SDK; windows.yml builds it and owns the release.

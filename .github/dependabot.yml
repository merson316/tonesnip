# Weekly update pull requests for the workflow actions and the NuGet packages. Actions arrive as two grouped pull requests
# (majors, and minors with patches), since several run only on a tag push and are proven together at the
# next release. NuGet minor and patch updates are grouped; a NuGet major gets a pull request of its own, since it can
# change behaviour. Work accumulates on a dev branch and main fast-forwards to it at each release, so apply these on
# the dev branch rather than merging them on GitHub; Dependabot closes each one when the release carrying it lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-major:
        update-types: [major]
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # ToneSnip.csproj references four Windows App SDK components at the versions one metapackage release names;
      # they move together, whatever the size of the update, so a lone component bump never mixes two releases.
      windows-app-sdk:
        patterns: ['Microsoft.WindowsAppSDK*']
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pruned from the restore graph (ToneSnip.csproj); a pull request for it would only reintroduce it.
      - dependency-name: Microsoft.WindowsAppSDK
